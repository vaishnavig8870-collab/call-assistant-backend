<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Call Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 320px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #ff6b00;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🔐 Admin Login</h1>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <div id="message"></div>

    </div>


    <script>

        async function login() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            if (!username || !password) {
                document.getElementById("message").innerText =
                    "Please enter username and password.";
                return;
            }

            try {

                const response = await fetch(
                    "https://call-assistant-backend.onrender.com/admin-login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {

                    localStorage.setItem(
                        "adminToken",
                        data.token
                    );

                    window.location.href = "admin.html";

                } else {

                    document.getElementById("message").innerText =
                        data.message || "Invalid login.";

                }

            } catch (error) {

                console.error(error);

                document.getElementById("message").innerText =
                    "Unable to connect to server.";

            }
        }

    </script>

</body>
</html>
