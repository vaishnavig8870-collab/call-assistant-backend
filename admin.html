<!DOCTYPE html>
<script>
    const adminToken = localStorage.getItem("adminToken");

    if (!adminToken) {
        window.location.href = "admin-login.html";
    }
</script>
<html>
<head>
    <title>Call Assistant - Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #ff6b00;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>📋 Call Assistant - Admin Dashboard</h1>

    <div id="message">Loading bookings...</div>

    <table id="bookingTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Service</th>
                <th>Date</th>
                <th>Location</th>
                <th>Request</th>
            </tr>
        </thead>

        <tbody id="bookingBody">
        </tbody>
    </table>

    <script>

        fetch("https://call-assistant-backend.onrender.com/bookings", {
    headers: {
        "Authorization": "Bearer " + localStorage.getItem("adminToken")
    }
})
            .then(response => response.json())
            .then(data => {

                const tableBody = document.getElementById("bookingBody");
                const message = document.getElementById("message");

                if (data.success) {

                    message.innerText = "";

                    data.bookings.forEach(booking => {

                        const row = document.createElement("tr");

                        row.innerHTML = `
                            <td>${booking.id}</td>
                            <td>${booking.name}</td>
                            <td>${booking.phone}</td>
                            <td>${booking.service}</td>
                            <td>${booking.date}</td>
                            <td>${booking.location}</td>
                            <td>${booking.request}</td>
                        `;

                        tableBody.appendChild(row);
                    });

                } else {
                    message.innerText = "Unable to load bookings.";
                }

            })
            .catch(error => {

                console.error(error);

                document.getElementById("message").innerText =
                    "Error connecting to server.";

            });

    </script>

</body>
</html>
