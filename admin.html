<!DOCTYPE html>
<script>
    const adminToken = localStorage.getItem("adminToken");

    if (!adminToken) {
        window.location.href = "admin-login.html";
    }
</script>
<html>
<head>
    <title>Call Assistant - Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #ff6b00;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>📋 Call Assistant - Admin Dashboard</h1>
     <button onclick="logout()" style="
    display: block;
    margin: 15px auto;
    padding: 10px 20px;
    background: #ff6b00;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
">
    🚪 Logout
</button>

    <div id="message">Loading bookings...</div>
<input
    type="text"
    id="searchBooking"
    placeholder="🔎 Search by name, phone, service or location"
    style="
        width: 90%;
        max-width: 500px;
        padding: 12px;
        margin: 15px auto;
        display: block;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    "
>

    <table id="bookingTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Service</th>
                <th>Date</th>
                <th>Location</th>
                <th>Request</th>
                <th>status</th>
                <th>Action</th>
           </tr>
        </thead>

        <tbody id="bookingBody">
        </tbody>
    </table>

    <script>
      function logout() {
    localStorage.removeItem("adminToken");
    window.location.href = "admin-login.html";
}

        fetch("https://call-assistant-backend.onrender.com/bookings", {
    headers: {
        "Authorization": "Bearer " + localStorage.getItem("adminToken")
    }
})
            .then(response => response.json())
            .then(data => {

                const tableBody = document.getElementById("bookingBody");
                const message = document.getElementById("message");

                if (data.success) {

                    message.innerText = "";

                    data.bookings.forEach(booking => {

                        const row = document.createElement("tr");

                        row.innerHTML = `
                            <td>${booking.id}</td>
                            <td>${booking.name}</td>
                            <td>${booking.phone}</td>
                            <td>${booking.service}</td>
                            <td>${booking.date}</td>
                            <td>${booking.location}</td>
                            <td>${booking.request}</td>
                            <td>
    <select onchange="updateStatus(${booking.id}, this.value)">

        <option value="Pending" ${booking.status === "Pending" ? "selected" : ""}>🟡 Pending</option>
        <option value="Accepted" ${booking.status === "Accepted" ? "selected" : ""}>🟢 Accepted</option>
        <option value="Completed" ${booking.status === "Completed" ? "selected" : ""}>🔵 Completed</option>

    </select>
</td>
<td>
    <button onclick="deleteBooking(${booking.id})"
        style="
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
        ">
        🗑️ Delete
    </button>
</td>
                        `;

                        tableBody.appendChild(row);
                    });

                } else {
                    message.innerText = "Unable to load bookings.";
                }

            })
            .catch(error => {

                console.error(error);

                document.getElementById("message").innerText =
                    "Error connecting to server.";

            });
const searchBox = document.getElementById("searchBooking");

searchBox.addEventListener("input", function () {

    const searchText = searchBox.value.toLowerCase();
    const rows = document.querySelectorAll("#bookingBody tr");

    rows.forEach(row => {

        const rowText = row.innerText.toLowerCase();

        if (rowText.includes(searchText)) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }

    });

});
async function updateStatus(id, status) {

    const token = localStorage.getItem("adminToken");

    try {

        const response = await fetch(
            "https://call-assistant-backend.onrender.com/bookings/" + id + "/status",
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    status: status
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            alert("Status update failed.");
        }

    } catch (error) {

        console.error(error);
        alert("Status update failed.");

    }
}

async function deleteBooking(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this booking?"
    );

    if (!confirmDelete) {
        return;
    }

    const token = localStorage.getItem("adminToken");

    try {

        const response = await fetch(
            "https://call-assistant-backend.onrender.com/bookings/" + id,
            {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const data = await response.json();

        if (data.success) {
            alert("Booking deleted successfully!");
            location.reload();
        } else {
            alert("Delete failed.");
        }

    } catch (error) {

        console.error(error);
        alert("Delete failed.");

    }
}
    </script>

</body>
</html>
